# AWS EC2 production deployment (CPU-only, no GPU)
# For cost-effective deployment on t3.medium or similar instances
# Usage: docker compose -f docker-compose.aws-cpu.yml up -d

services:
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    container_name: speaches
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEFAULT_MODEL=Systran/faster-whisper-small
      - WHISPER__MODEL=Systran/faster-whisper-small
      - PRELOAD_MODELS=["Systran/faster-whisper-small"]
    volumes:
      - speaches-models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - app-network

  bot:
    build:
      context: ../bot
      dockerfile: Dockerfile
    container_name: zoom-bot
    restart: "no"  # Manual start only
    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - SPEACHES_URL=http://speaches:8000
      - WHISPER__MODEL=Systran/faster-whisper-small
      - DB_PATH=/data/meetings.db
      - TRANSCRIPT_DIR=/data/transcripts
      - BOT_WS_PORT=8765
      - BOT_NAME=Companion
      - AWS_REGION=eu-central-1
    volumes:
      - bot-data:/data
      - /run/user/1000/pulse:/run/user/1000/pulse
    networks:
      - app-network
    depends_on:
      speaches:
        condition: service_healthy

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: zoom-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_PATH=/data/meetings.db
    volumes:
      - bot-data:/data
    networks:
      - app-network

volumes:
  bot-data:
  speaches-models:

networks:
  app-network:
    driver: bridge
