# AWS EC2 production deployment (CPU-only, no GPU)
# For cost-effective deployment on t3.small or similar instances
# Usage: docker compose -f docker-compose.aws-cpu.yml up -d

services:
  bot-rtms:
    build:
      context: ../bot-rtms
      dockerfile: Dockerfile
    container_name: zoom-bot-rtms
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8765:8765"
    environment:
      - ZM_RTMS_CLIENT=${ZM_RTMS_CLIENT}
      - ZM_RTMS_SECRET=${ZM_RTMS_SECRET}
      - ZM_RTMS_PORT=8080
      - BOT_WS_PORT=8765
      - DB_PATH=/data/meetings.db
      - TRANSCRIPT_DIR=/data/transcripts
      - AWS_REGION=eu-central-1
    volumes:
      - bot-data:/data
    networks:
      - app-network

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: zoom-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DB_PATH=/data/meetings.db
    volumes:
      - bot-data:/data
    networks:
      - app-network

volumes:
  bot-data:

networks:
  app-network:
    driver: bridge
