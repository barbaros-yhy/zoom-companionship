# Local development - Caption Mode only
# Usage: docker compose -f docker-compose.local.yml up -d

services:
  api:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm install && node server.js"
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_PATH=/data/meetings.db
    volumes:
      - ../api:/app
      - /app/node_modules
      - local-data:/data

volumes:
  local-data:
