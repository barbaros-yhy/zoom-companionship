# Production deployment - Caption Mode (DOM scraping)
# No GPU required - uses Zoom's native Live Transcript
# Usage: docker compose up -d

services:
  bot:
    build:
      context: ../bot
      dockerfile: Dockerfile
    container_name: zoom-bot
    restart: "no"  # Manual start only
    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - DB_PATH=/data/meetings.db
      - TRANSCRIPT_DIR=/data/transcripts
      - BOT_WS_PORT=8765
      - BOT_NAME=Companion
      - AWS_REGION=${AWS_REGION:-eu-central-1}
    volumes:
      - bot-data:/data
    networks:
      - app-network

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: zoom-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_PATH=/data/meetings.db
    volumes:
      - bot-data:/data
    networks:
      - app-network

volumes:
  bot-data:

networks:
  app-network:
    driver: bridge
