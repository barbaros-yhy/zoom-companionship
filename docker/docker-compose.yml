services:
  bot-rtms:
    build:
      context: ../bot-rtms
      dockerfile: Dockerfile
    container_name: zoom-bot-rtms
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8765:8765"
    environment:
      - ZM_RTMS_CLIENT=${ZM_RTMS_CLIENT}
      - ZM_RTMS_SECRET=${ZM_RTMS_SECRET}
      - ZM_RTMS_PORT=8080
      - BOT_WS_PORT=8765
      - DB_PATH=/data/meetings.db
      - TRANSCRIPT_DIR=/data/transcripts
      - AWS_REGION=${AWS_REGION:-eu-central-1}
    volumes:
      - bot-data:/data
    networks:
      - app-network

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: zoom-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DB_PATH=/data/meetings.db
    volumes:
      - bot-data:/data
    networks:
      - app-network

volumes:
  bot-data:

networks:
  app-network:
    driver: bridge
